# 提取规则
extract:
  max_links_per_email: 3      # 每封邮件最多提取链接数
  min_link_age_hours: 24      # 忽略 24h 内的新链接（让广告降级）
  prefer_original_url: true   # 优先获取原始链接（非短链）
