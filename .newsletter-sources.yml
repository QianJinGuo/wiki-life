# Life Wiki Newsletter Sources
# 通过 newsletter-link-extractor 从 Gmail 提取

sources:
  # 中文个人成长类
  - name: "整理事情"
    sender: "@zhenglishiqing.com"
    category: self-improvement
    
  - name: "知识工厂"
    sender: "@mp.weixin.qq.com"
    category: productivity
    
  - name: "效率军馆"
    sender: "@toysdaily.com"
    category: efficiency
    
  # 英文类
  - name: "Tiny Buddha"
    sender: "tinybuddha.com"
    category: mental-health
    
  - name: "Mark Manson"
    sender: "markmanson.net"
    category: self-improvement
    
  - name: "The School of Life"
    sender: "theschooloflife.com"
